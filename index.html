<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>hyjuunn</title>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-91T0DTP2N4"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          gtag('config', 'G-91T0DTP2N4');
        </script>
        <style>
            :root{
                --bg:#050507;
                --panel:#0b0c10;
                --neon:#00e6ff; /* neon blue */
                --dir-blue:#007aa0; /* dark neon blue for folder names */
                --hist-blue:#ff4db8; /* darker blue for history username */
                --typed:#ffffff; /* typed text and caret now white */
                --error:#ff4b4b; /* red for errors */
                --file:#ffd166; /* neon yellow for files */
                --accent:#ff4db8; /* neon pink accent for username */
                --purple:#a78bfa; /* extra accent */
                --muted:#cfcfcf;
                --radius:10px;
                --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', 'Cascadia Mono', 'Segoe UI Mono', monospace;
            }
            html,body{height:100%;}
            html{font-size:clamp(14px, 1.5vw, 18px);} /* zoom-friendly base */
            body{
                margin:0;
                background:linear-gradient(180deg, var(--bg) 0%, #07080a 100%);
                color:var(--muted);
                font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                -webkit-font-smoothing:antialiased;
                -moz-osx-font-smoothing:grayscale;
                display:flex;
                align-items:center;
                justify-content:center;
                padding:2rem;
                min-height:100vh;
                overflow-x:hidden; /* prevent horizontal page growth */
                box-sizing:border-box;
            }
            .shell-wrap{
                width:100%;
                max-width:980px;
                background:var(--panel);
                border-radius:var(--radius);
                box-shadow:0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
                padding:1.25rem;
                box-sizing:border-box;
                border:1px solid rgba(0,230,255,0.06);
                display:flex;
                flex-direction:column;
                align-items:stretch;
                max-height:calc(100vh - 4rem); /* keep the shell within viewport */
                overflow:hidden; /* prevent shell from growing the page */
            }
            header.title{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.5rem}
            .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(90deg,#ff6b6b,#ff9f6b);box-shadow:0 0 6px rgba(255,111,111,0.15)}
            .title h2{margin:0;font-size:1rem;color:var(--neon);font-weight:700;font-family:var(--mono)}

            /* color classes */
            .typed{color:var(--typed)}
            .error{color:var(--error);font-weight:700}
            .file{color:var(--file)}
            .hist-user{color:var(--hist-blue);font-weight:700}
            .help{color:#ffffff;font-family:var(--mono);font-weight:500}
            .help .cmd{color:#ffffff;font-weight:700;padding-right:0.5rem}

            .terminal{
                background:linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.04));
                padding:1rem;
                border-radius:8px;
                min-height:320px;
                max-height:65vh;
                overflow:auto;
                font-family:var(--mono);
                font-size:1rem;
                color:var(--neon);
                line-height:1.5;
                text-align:left;
                box-sizing:border-box;
                word-break:break-word; /* break long tokens to avoid expanding */
                overflow-wrap:break-word;
            }
            .line{white-space:pre-wrap;word-wrap:break-word}
            .muted{color:var(--muted)}

            .prompt{display:flex;gap:0.5rem;align-items:center}
            .prompt .user{color:var(--accent);font-weight:700;min-width:0}
            .prompt .at{color:var(--neon);opacity:1}
            .prompt .dir{color:var(--neon);font-weight:600}
            .dir-name{color:var(--dir-blue);font-weight:600}
            .hist-at{color:var(--neon);opacity:1}
            .input-wrap{flex:1;display:flex;min-width:0}
            .cmd-input{
                background:transparent;border:0;outline:0;color:var(--typed);flex:1;font-family:var(--mono);font-size:1rem;padding:0;margin:0;min-width:0;caret-color:var(--typed);width:100%;max-width:100%;box-sizing:border-box;
            }

            .info-block{color:var(--muted);padding:0.25rem 0}
            a.link{color:var(--neon);text-decoration:underline}

            footer.hint{margin-top:0.6rem;color:rgba(255,255,255,0.06);font-size:0.85rem}

            /* responsive tweaks */
            @media (max-width:520px){
                .shell-wrap{padding:0.8rem}
                .terminal{font-size:0.95rem}
            }
        </style>
        <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    </head>
    <body>
        <main class="shell-wrap">
            <header class="title">
                <div class="dot" aria-hidden></div>
                <div class="title"><h2>hyjuunn — terminal</h2></div>
            </header>

            <section id="terminal" class="terminal" role="region" aria-label="Interactive terminal">
                <div class="line muted">Welcome — type <span style="color:var(--neon)">help</span> to see available commands.</div>
                <div id="output"></div>
                <div id="inputLine" class="prompt" aria-live="polite">
                    <div class="user">hyunjune</div>
                    <div class="at">@</div>
                    <div class="dir">~</div>
                    <div class="input-wrap">
                        <input id="cmd" class="cmd-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
                    </div>
                </div>
            </section>

            <div class="hint muted" style="margin-top:0.6rem">Use <code style="color:var(--neon)">↑</code>/<code style="color:var(--neon)">↓</code> to navigate history.</div>
        </main>
        
        <div class="cf-turnstile"
             data-sitekey="0x4AAAAAACCcOl0sTjQPi2hz"
             data-size="invisible"></div>
             
        <script>
            (function(){
                const output = document.getElementById('output');
                const input = document.getElementById('cmd');
                const terminal = document.getElementById('terminal');
                const userName = 'user';
                const userEl = document.querySelector('.prompt .user');
                
                // === Cloudflare logging config ===
                const WORKER_LOG_URL = "https://hyjuunn-logger.junekim1013.workers.dev/log";
                
                // === [핵심 변경] 로그 대기열 (Queue) 시스템 ===
                const logQueue = [];
                let isProcessingQueue = false;

                // 1. 토큰이 준비될 때까지 무한 대기하는 함수 (백그라운드 처리용)
                async function waitForTokenAndGet(){
                    const el = document.querySelector('input[name="cf-turnstile-response"]');
                    if(!el) return null;

                    // 최대 30초 동안 토큰을 기다림 (보통 1~2초면 됨)
                    for(let i=0; i<300; i++){
                        if(el.value) {
                            const t = el.value;
                            el.value = ""; // 사용한 토큰은 즉시 비움 (중복 방지)
                            return t;
                        }
                        await new Promise(r => setTimeout(r, 100)); // 0.1초 대기
                    }
                    return null; // 타임아웃
                }

                // 2. 대기열 처리기 (하나씩 꺼내서 전송 -> 리셋 -> 전송 반복)
                async function processQueue(){
                    if(isProcessingQueue) return; // 이미 처리 중이면 중복 실행 방지
                    isProcessingQueue = true;

                    while(logQueue.length > 0){
                        // A. 대기열에서 가장 오래된 명령어 확인 (꺼내지는 않음)
                        const currentItem = logQueue[0];

                        // B. 토큰 확보 시도
                        const token = await waitForTokenAndGet();
                        
                        // 토큰을 못 받았다면 (타임아웃 등) 잠시 쉬었다 다시 시도하거나, 스킵
                        if(!token){
                            // Turnstile이 먹통이면 무한루프 돌 수 있으므로 1초 대기 후 리셋 시도
                            if(window.turnstile) window.turnstile.reset();
                            await new Promise(r => setTimeout(r, 1000));
                            continue;
                        }

                        // C. 전송 (토큰이 있으므로 전송)
                        try{
                            await fetch(WORKER_LOG_URL, {
                                method: "POST",
                                headers: {"Content-Type":"application/json"},
                                body: JSON.stringify({
                                    cmd: sanitizeForLog(currentItem.raw),
                                    cwd: currentItem.cwd,
                                    ts: currentItem.ts,
                                    turnstileToken: token
                                })
                            });
                        } catch(e){
                            console.error("Log send error:", e);
                        } finally {
                            // D. 전송 완료 후 대기열에서 제거 및 위젯 리셋
                            logQueue.shift(); // 성공하든 실패하든 일단 큐에서 제거 (다음거 처리)
                            if(window.turnstile) window.turnstile.reset();
                        }
                    }

                    isProcessingQueue = false;
                }
                
                // 3. 메인 로깅 함수 (이제 기다리지 않고 큐에 넣고 바로 끝냄)
                function logCommand(raw){
                    // 대기열에 작업 추가 (명령어, 현재위치, 시간)
                    logQueue.push({
                        raw: raw,
                        cwd: cwd,
                        ts: Date.now()
                    });
                    
                    // 백그라운드 처리기 깨우기
                    processQueue();
                }

                function sanitizeForLog(s){
                    return String(s || "")
                      .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/ig, "[email]")
                      .replace(/\b\d{3,}\b/g, "[num]")
                      .slice(0, 200);
                }

                const fileSystem = {
                    '~': {
                        type:'dir', children:['hyunjune','linkedin','github']
                    },
                    'hyunjune':{type:'dir', children:['about.txt','skills.txt','contact.txt']},
                    'about.txt':{type:'file', content:'A Software Engineer with a unique blend of high-level and low-level programming expertise. Work experience as a software engineering intern in Alocados Corp, and as an operations specialist in Orders Directorate of the Eighth Army. Fluency in C/C++ and Python with expertise in ML, strongly backgrounded by a GCP PMLE certification. Led key projects of development of a VLM (NIPA-Google) and a GIS mapping system (University of Toronto’s Engineering Department).\nSoon to begin a Machine Learning Software Engineer Internship at AMD, contributing to GPU-accelerated ML systems.'},
                    'skills.txt':{type:'file', content:'Languages: C/C++, Python, SQL, JavaScript, HTML/CSS, ARM Assembly, Verilog\nFrameworks/Libraries: FastAPI, Node.js, React, AsyncIO, TensorFlow, PyTorch, scikit-learn, Numpy, pandas\nDatabases: MongoDB, PostgreSQL\nTools: Git, Docker, Kubernetes, AWS, Google Cloud, VS Code, Jupyter, Quartus, ModelSim, FPGA'},
                    'contact.txt':{type:'file', content:'hyunjunn.kim@mail.utoronto.ca'},
                    'linkedin':{type:'link', url:'https://www.linkedin.com/in/hyunjunekim/'},
                    'github':{type:'link', url:'https://github.com/hyjuunn'}
                };

                let cwd = '~';
                let prevCwd = null; 

                function print(html, className){
                    const el = document.createElement('div');
                    el.className = 'line' + (className? ' '+className : '');
                    el.innerHTML = html;
                    output.appendChild(el);
                    terminal.scrollTop = terminal.scrollHeight;
                }

                function help(){
                    print('<div class="help">Available commands:</div>');
                    const cmds = [
                        ['help','Show this help'],
                        ['ls','List files/folders'],
                        ['cd <name>','Change directory'],
                        ['pwd','Show current path'],
                        ['cat <file>','Show file contents'],
                        ['clear','Clear screen'],
                        ['echo <text>','Print text'],
                        ['exit','Close this tab/window']
                    ];
                    cmds.forEach(([c,d])=>{
                        print(`<div class="help"><span class="cmd">${escapeHtml(c)}</span>— ${escapeHtml(d)}</div>`);
                    });
                }

                function cd(args){
                    const target = args[0];
                    if(!target || target==='~'){ cwd='~'; updatePrompt(); return }
                    const t = String(target).replace(/\/+$/,'');
                    if(t === '.'){
                        if(prevCwd){ const old = cwd; cwd = prevCwd; prevCwd = old; updatePrompt(); }
                        else { print('<span class="muted">No previous directory</span>'); }
                        return;
                    }
                    const curNode = fileSystem[cwd];
                    if(!curNode || curNode.type !== 'dir' || !Array.isArray(curNode.children) || !curNode.children.includes(t)){
                        print(`<span class="error">No such directory: ${escapeHtml(t)}</span>`);
                        return;
                    }
                    const entry = fileSystem[t];
                    if(!entry){ print(`<span class="error">No such directory: ${escapeHtml(t)}</span>`); return }
                    if(entry.type === 'link'){
                        const url = entry.url;
                        try{ window.open(url, '_blank'); print(`<span class="muted">Opening ${escapeHtml(url)}</span>`); }catch(e){ print(`<span class="muted">Opening: ${escapeHtml(url)}</span>`); }
                        return;
                    }
                    if(entry.type === 'dir'){
                        prevCwd = cwd;
                        cwd = t; updatePrompt();
                        return;
                    }
                    print(`<span class="error">Not a directory: ${escapeHtml(t)}</span>`);
                }

                function cat(args){
                    const name = (args && args[0]) ? String(args[0]).trim() : '';
                    if(!name){ print('<span class="muted">Usage: cat &lt;file&gt;</span>'); return }
                    const curNode = fileSystem[cwd];
                    if(!curNode || curNode.type!=='dir' || !Array.isArray(curNode.children)){
                        print(`<span class="error">Not a directory: ${escapeHtml(cwd)}</span>`); return
                    }
                    if(!curNode.children.includes(name)){
                        print(`<span class="error">No such file: ${escapeHtml(name)}</span>`); return
                    }
                    const node = fileSystem[name];
                    if(!node || node.type !== 'file'){ print(`<span class="error">No such file: ${escapeHtml(name)}</span>`); return }
                    const content = escapeHtml(node.content || '');
                    const html = `<span class="muted">${content.replace(/\n/g,'<br>')}</span>`;
                    print(html);
                }

                function ls(args){
                    const node = fileSystem[cwd];
                    if(!node || node.type!=='dir'){ print(`<span class="error">Not a directory: ${escapeHtml(cwd)}</span>`); return }
                    let target = cwd;
                    if(args && args.length>0){
                        const raw = String(args[0]).trim();
                        if(!raw){ }
                        else {
                            const t = raw.replace(/\/+$/,'');
                            if(t === '~' || t === '~/'){
                                prevCwd = cwd;
                                target = '~';
                            } else if(t.startsWith('~/')){
                                const name = t.slice(2);
                                if(fileSystem[name] && fileSystem[name].type==='dir') target = name;
                                else { print(`<span class="error">No such directory: ${escapeHtml(t)}</span>`); return }
                            } else {
                                if(!node.children || !node.children.includes(t)){ print(`<span class="error">No such directory: ${escapeHtml(t)}</span>`); return }
                                const entry = fileSystem[t];
                                if(!entry || entry.type!=='dir'){ print(`<span class="error">Not a directory: ${escapeHtml(t)}</span>`); return }
                                target = t;
                            }
                        }
                    }
                    const listNode = fileSystem[target];
                    if(!listNode || listNode.type!=='dir'){ print(`<span class="error">Not a directory: ${escapeHtml(target)}</span>`); return }
                    const list = (listNode.children||[]).map(name=>{
                        const n = fileSystem[name]||{};
                        if(n.type==='dir') return `<span class="dir-name">${escapeHtml(name)}/</span>`;
                        if(n.type==='link') return `<span style="color:var(--purple)">${escapeHtml(name)}/</span>`;
                        return `<span class="file">${escapeHtml(name)}</span>`;
                    }).join('  ');
                    print(list||'<span class="muted">(empty)</span>');
                }

                function echo(args){ print(escapeHtml(args.join(' '))); }
                function pwd(){ print(cwd) }
                function clear(){ output.innerHTML = ''; }

                function exitCmd(){
                    try{ window.open('','_self'); window.close(); }catch(e){ }
                    const id = 'close-fallback-' + Date.now();
                    print(`<div class="muted">If the tab did not close automatically, <a href="#" class="link" id="${id}">click here to close it</a> or press <code>Ctrl+W</code>.</div>`);
                    setTimeout(()=>{
                        const a = document.getElementById(id);
                        if(!a) return;
                        a.addEventListener('click', function(ev){
                            ev.preventDefault();
                            try{ window.open('','_self'); window.close(); }catch(e){ }
                            try{ window.location.href = 'about:blank'; }catch(e){ }
                        });
                    },50);
                }

                function updatePrompt(){
                    const dirEl = document.querySelector('.prompt .dir');
                    if(dirEl) dirEl.textContent = cwd;
                    if(userEl) userEl.textContent = userName;
                }

                const history = [];
                let histIndex = -1;

                input.addEventListener('keydown', function(e){
                    if(e.key === 'Enter'){
                        const raw = input.value.trim();
                        if(!raw) { input.value=''; return }
                        const promptEcho = `<span class="hist-user">${userName}</span> <span class="hist-at">@</span> <span class="dir">${escapeHtml(cwd)}</span> $`;
                        print(`${promptEcho} <span class="typed">${escapeHtml(raw)}</span>`);
                        
                        // [중요] 사용자는 기다리지 않고 바로 다음 명령 입력 가능
                        // 로그는 큐에 넣고 백그라운드에서 전송됨
                        logCommand(raw);
                        
                        handleCommand(raw);
                        history.unshift(raw);
                        histIndex = -1;
                        input.value = '';
                        e.preventDefault();
                    } else if(e.key === 'ArrowUp'){
                        if(history.length>0){ histIndex = Math.min(history.length-1, (histIndex+1)); input.value = history[histIndex] }
                        e.preventDefault();
                    } else if(e.key === 'ArrowDown'){
                        if(history.length>0){ histIndex = Math.max(-1, (histIndex-1)); input.value = history[histIndex]||'' }
                        e.preventDefault();
                    } else if(e.key === 'Tab'){
                        e.preventDefault();
                        autocomplete();
                    }
                });

                function handleCommand(raw){
                    const parts = raw.split(/\s+/).filter(Boolean);
                    const cmd = parts[0].toLowerCase();
                    const args = parts.slice(1);
                    switch(cmd){
                        case 'help': help(); break;
                        case 'ls': ls(args); break;
                        case 'cd': cd(args); break;
                        case 'pwd': pwd(); break;
                        case 'cat': cat(args); break;
                        case 'exit': exitCmd(); break;
                        case 'clear': clear(); break;
                        case 'echo': echo(args); break;
                        default:
                            print('<span class="error">Unknown command: '+escapeHtml(cmd)+'</span>');
                    }
                }

                function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

                function autocomplete(){
                    const val = input.value.trim();
                    const candidates = ['help','ls','cd','pwd','cat','clear','echo','exit'];
                    const matched = candidates.filter(c=>c.startsWith(val));
                    if(matched.length===1) input.value = matched[0] + ' ';
                }

                terminal.addEventListener('click', ()=> input.focus());
                window.addEventListener('load', ()=>{ input.focus(); updatePrompt(); });

            })();
        </script>
    </body>
</html>
