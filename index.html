<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hyjuunn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-91T0DTP2N4"></script>
<script>

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root{
    --bg:#050507;
    --panel:#0b0c10;
    --neon:#00e6ff;
    --dir-blue:#007aa0;
    --hist-blue:#ff4db8;
    --typed:#ffffff;
    --error:#ff4b4b;
    --file:#ffd166;
    --accent:#ff4db8;
    --purple:#a78bfa;
    --muted:#cfcfcf;
    --radius:10px;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, 'Roboto Mono', 'Cascadia Mono', 'Segoe UI Mono', monospace;
  }

  *,*::before,*::after{box-sizing:border-box}

  html,body{height:100%}
  html{font-size:clamp(14px, 1.5vw, 18px)}

  body{
    margin:0;
    min-height:100vh;
    padding:2rem;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(180deg, var(--bg) 0%, #07080a 100%);
    color:var(--muted);
    font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .shell{
    display:flex;
    flex-direction:column;
    width:100%;
    max-width:980px;
    max-height:calc(100vh - 4rem);
    padding:1.25rem;
    background:var(--panel);
    border:1px solid rgba(0,230,255,0.06);
    border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
    overflow:hidden;
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap:0.75rem;
    margin-bottom:0.5rem;
  }

  .titlebar h2{
    margin:0;
    font-family:var(--mono);
    font-size:1rem;
    font-weight:700;
    color:var(--neon);
  }

  .dot{
    width:10px;
    height:10px;
    border-radius:50%;
    background:linear-gradient(90deg,#ff6b6b,#ff9f6b);
    box-shadow:0 0 6px rgba(255,111,111,0.15);
  }

  .terminal{
    min-height:320px;
    max-height:65vh;
    padding:1rem;
    background:linear-gradient(180deg, rgba(0,0,0,0.18), rgba(0,0,0,0.04));
    border-radius:8px;
    font-family:var(--mono);
    font-size:1rem;
    line-height:1.5;
    color:var(--neon);
    text-align:left;
    overflow:auto;
    overflow-wrap:break-word;
    word-break:break-word;
  }

  .line{
    white-space:pre-wrap;
    word-wrap:break-word;
  }

  .muted{color:var(--muted)}
  .typed{color:var(--typed)}
  .error{color:var(--error);font-weight:700}
  .file{color:var(--file)}
  .link-name{color:var(--purple)}
  .dir-name{color:var(--dir-blue);font-weight:600}
  .hist-user{color:var(--hist-blue);font-weight:700}
  .hist-at{color:var(--neon)}

  .help{font-family:var(--mono);font-weight:500;color:#ffffff}
  .help .cmd{font-weight:700;padding-right:0.5rem}

  .prompt{
    display:flex;
    align-items:center;
    gap:0.5rem;
  }

  .prompt .user{color:var(--accent);font-weight:700;min-width:0}
  .prompt .at{color:var(--neon)}
  .prompt .dir,.dir{color:var(--neon);font-weight:600}

  .input-wrap{
    display:flex;
    flex:1;
    min-width:0;
  }

  .cmd-input{
    flex:1;
    width:100%;
    max-width:100%;
    min-width:0;
    margin:0;
    padding:0;
    border:0;
    outline:0;
    background:transparent;
    color:var(--typed);
    caret-color:var(--typed);
    font-family:var(--mono);
    font-size:1rem;
  }

  a.link{color:var(--neon);text-decoration:underline}

  .hint{margin-top:0.6rem}

  @media (max-width:520px){
    body{padding:1rem}
    .shell{padding:0.8rem;max-height:calc(100vh - 2rem)}
    .terminal{font-size:0.95rem}
  }
</style>
</head>
<body>
  <main class="shell">
    <header class="titlebar">
      <span class="dot" aria-hidden="true"></span>
      <h2>hyjuunn — terminal</h2>
    </header>

    <section id="terminal" class="terminal" role="region" aria-label="Interactive terminal">
      <div class="line muted">Welcome — type <span style="color:var(--neon)">help</span> to see available commands.</div>
      <div id="output"></div>
      <div class="prompt" aria-live="polite">
        <span id="promptUser" class="user"></span>
        <span class="at">@</span>
        <span id="promptDir" class="dir"></span>
        <span class="input-wrap">
          <input id="cmd" class="cmd-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Command input">
        </span>
      </div>
    </section>

    <p class="hint muted">Use <code style="color:var(--neon)">↑</code>/<code style="color:var(--neon)">↓</code> for history, <code style="color:var(--neon)">Tab</code> to complete.</p>
  </main>

  <div class="cf-turnstile" data-sitekey="0x4AAAAAACCcOl0sTjQPi2hz" data-size="invisible"></div>

<script>
(function () {
  "use strict";

  var LOG_ENDPOINT = "https://hyjuunn-logger.junekim1013.workers.dev/log";
  var USER = "user";
  var ROOT = "~";

  var FS = {
    "~": { type: "dir", children: ["hyunjune", "linkedin", "github"] },
    "hyunjune": { type: "dir", children: ["about.txt", "skills.txt", "contact.txt"] },
    "about.txt": {
      type: "file",
      content: "A Software Engineer with a unique blend of high-level and low-level programming expertise. Work experience as a software engineering intern in Alocados Corp, and as an operations specialist in Orders Directorate of the Eighth Army. Fluency in C/C++ and Python with expertise in ML, strongly backgrounded by a GCP PMLE certification. Led key projects of development of a VLM (NIPA-Google) and a GIS mapping system (University of Toronto\u2019s Engineering Department).\nCurrently contributing to AI Inference Systems as a Machine Learning Software Engineer Intern at AMD."
    },
    "skills.txt": {
      type: "file",
      content: "Languages: C/C++, Python, SQL, JavaScript, HTML/CSS, ARM Assembly, Verilog\nFrameworks/Libraries: FastAPI, Node.js, React, AsyncIO, TensorFlow, PyTorch, scikit-learn, Numpy, pandas\nDatabases: MongoDB, PostgreSQL\nTools: Git, Docker, Kubernetes, AWS, Google Cloud, VS Code, Jupyter, Quartus, ModelSim, FPGA"
    },
    "contact.txt": { type: "file", content: "hyunjunn.kim@mail.utoronto.ca" },
    "linkedin": { type: "link", url: "https://www.linkedin.com/in/hyunjunekim/" },
    "github": { type: "link", url: "https://github.com/hyjuunn" }
  };

  var HELP_ENTRIES = [
    ["help", "Show this help"],
    ["ls", "List files/folders"],
    ["cd <name>", "Change directory"],
    ["pwd", "Show current path"],
    ["cat <file>", "Show file contents"],
    ["clear", "Clear screen"],
    ["echo <text>", "Print text"],
    ["exit", "Close this tab/window"]
  ];

  var terminalEl = document.getElementById("terminal");
  var outputEl = document.getElementById("output");
  var inputEl = document.getElementById("cmd");
  var promptUserEl = document.getElementById("promptUser");
  var promptDirEl = document.getElementById("promptDir");

  var cwd = ROOT;
  var prevCwd = null;
  var history = [];
  var historyIndex = -1;

  function has(object, key) {
    return Object.prototype.hasOwnProperty.call(object, key);
  }

  function getNode(name) {
    return has(FS, name) ? FS[name] : null;
  }

  function childrenOf(name) {
    var node = getNode(name);
    return node && node.type === "dir" && Array.isArray(node.children) ? node.children : [];
  }

  function findParent(name) {
    var keys = Object.keys(FS);
    for (var i = 0; i < keys.length; i += 1) {
      if (childrenOf(keys[i]).indexOf(name) !== -1) return keys[i];
    }
    return ROOT;
  }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }

  function stripTrailingSlash(value) {
    return String(value).trim().replace(/\/+$/, "");
  }

  function scrollToBottom() {
    terminalEl.scrollTop = terminalEl.scrollHeight;
  }

  function appendLine(node) {
    outputEl.appendChild(node);
    scrollToBottom();
  }

  function print(html) {
    var line = document.createElement("div");
    line.className = "line";
    line.innerHTML = html;
    appendLine(line);
  }

  function printMuted(text) {
    print('<span class="muted">' + escapeHtml(text) + "</span>");
  }

  function printError(text) {
    print('<span class="error">' + escapeHtml(text) + "</span>");
  }

  function promptHtml() {
    return '<span class="hist-user">' + escapeHtml(USER) + "</span> " +
           '<span class="hist-at">@</span> ' +
           '<span class="dir">' + escapeHtml(cwd) + "</span> $";
  }

  function echoInput(text) {
    print(promptHtml() + ' <span class="typed">' + escapeHtml(text) + "</span>");
  }

  function updatePrompt() {
    promptUserEl.textContent = USER;
    promptDirEl.textContent = cwd;
  }

  function setCwd(next) {
    prevCwd = cwd;
    cwd = next;
    updatePrompt();
  }

  function formatEntry(name) {
    var node = getNode(name);
    var type = node ? node.type : null;
    if (type === "dir") return '<span class="dir-name">' + escapeHtml(name) + "/</span>";
    if (type === "link") return '<span class="link-name">' + escapeHtml(name) + "/</span>";
    if (type === "file") return '<span class="file">' + escapeHtml(name) + "</span>";
    return '<span class="muted">' + escapeHtml(name) + "</span>";
  }

  function formatCommandName(name) {
    return '<span class="help">' + escapeHtml(name) + "</span>";
  }

  function openExternal(url) {
    try {
      window.open(url, "_blank", "noopener");
    } catch (error) {
      void error;
    }
    printMuted("Opening " + url);
  }

  function closeWindow() {
    try {
      window.open("", "_self");
      window.close();
    } catch (error) {
      void error;
    }
  }

  var logger = (function () {
    var queue = [];
    var sending = false;

    function sanitize(value) {
      return String(value === null || value === undefined ? "" : value)
        .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, "[email]")
        .replace(/\b\d{3,}\b/g, "[num]")
        .slice(0, 200);
    }

    function waitForToken() {
      var field = document.querySelector('input[name="cf-turnstile-response"]');
      if (!field) return Promise.resolve(null);

      return new Promise(function (resolve) {
        var attempts = 0;
        var timer = setInterval(function () {
          attempts += 1;
          if (field.value) {
            var token = field.value;
            field.value = "";
            clearInterval(timer);
            resolve(token);
            return;
          }
          if (attempts >= 100) {
            clearInterval(timer);
            resolve(null);
          }
        }, 100);
      });
    }

    function flush() {
      if (sending || queue.length === 0) return;
      sending = true;

      waitForToken()
        .then(function (token) {
          if (!token) return null;
          var batch = queue.splice(0, queue.length);
          return fetch(LOG_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ batch: batch, turnstileToken: token })
          });
        })
        .catch(function (error) {
          console.error("log batch failed", error);
        })
        .then(function () {
          if (window.turnstile && typeof window.turnstile.reset === "function") {
            try {
              window.turnstile.reset();
            } catch (error) {
              void error;
            }
          }
          sending = false;
          if (queue.length > 0) setTimeout(flush, 500);
        });
    }

    return {
      push: function (command) {
        queue.push({ cmd: sanitize(command), cwd: cwd, ts: Date.now() });
        flush();
      }
    };
  })();

  function cmdHelp() {
    print('<div class="help">Available commands:</div>');
    HELP_ENTRIES.forEach(function (entry) {
      print('<div class="help"><span class="cmd">' + escapeHtml(entry[0]) + "</span>\u2014 " + escapeHtml(entry[1]) + "</div>");
    });
  }

  function cmdPwd() {
    print(escapeHtml(cwd));
  }

  function cmdClear() {
    outputEl.innerHTML = "";
  }

  function cmdEcho(args) {
    if (args.length > 0 && args[0].toLowerCase() === "oia") {
      try {
        window.open("oia.html", "_blank", "noopener");
      } catch (error) {
        void error;
      }
      printMuted("Opening OIA in a new tab...");
      return;
    }
    print(escapeHtml(args.join(" ")));
  }

  function cmdLs(args) {
    var current = getNode(cwd);
    if (!current || current.type !== "dir") {
      printError("Not a directory: " + cwd);
      return;
    }

    var target = cwd;
    var raw = args.length > 0 ? stripTrailingSlash(args[0]) : "";

    if (raw) {
      if (raw === ROOT) {
        target = ROOT;
      } else if (raw.indexOf("~/") === 0) {
        var nested = raw.slice(2);
        var nestedNode = getNode(nested);
        if (!nestedNode || nestedNode.type !== "dir") {
          printError("No such directory: " + raw);
          return;
        }
        target = nested;
      } else {
        if (childrenOf(cwd).indexOf(raw) === -1) {
          printError("No such directory: " + raw);
          return;
        }
        var node = getNode(raw);
        if (!node || node.type !== "dir") {
          printError("Not a directory: " + raw);
          return;
        }
        target = raw;
      }
    }

    var entries = childrenOf(target);
    print(entries.length > 0 ? entries.map(formatEntry).join("  ") : '<span class="muted">(empty)</span>');
  }

  function cmdCd(args) {
    var raw = args.length > 0 ? stripTrailingSlash(args[0]) : "";

    if (raw === "" || raw === ROOT) {
      setCwd(ROOT);
      return;
    }

    if (raw === ".") return;

    if (raw === "-") {
      if (!prevCwd) {
        printMuted("No previous directory");
        return;
      }
      var previous = prevCwd;
      prevCwd = cwd;
      cwd = previous;
      updatePrompt();
      return;
    }

    if (raw === "..") {
      if (cwd === ROOT) return;
      setCwd(findParent(cwd));
      return;
    }

    if (childrenOf(cwd).indexOf(raw) === -1) {
      printError("No such directory: " + raw);
      return;
    }

    var node = getNode(raw);
    if (!node) {
      printError("No such directory: " + raw);
      return;
    }
    if (node.type === "link") {
      openExternal(node.url);
      return;
    }
    if (node.type === "dir") {
      setCwd(raw);
      return;
    }

    printError("Not a directory: " + raw);
  }

  function cmdCat(args) {
    var name = args.length > 0 ? String(args[0]).trim() : "";
    if (!name) {
      printMuted("Usage: cat <file>");
      return;
    }

    if (childrenOf(cwd).indexOf(name) === -1) {
      printError("No such file: " + name);
      return;
    }

    var node = getNode(name);
    if (!node || node.type !== "file") {
      printError("No such file: " + name);
      return;
    }

    print('<span class="muted">' + escapeHtml(node.content || "").replace(/\n/g, "<br>") + "</span>");
  }

  function cmdExit() {
    closeWindow();

    var line = document.createElement("div");
    line.className = "line muted";

    var anchor = document.createElement("a");
    anchor.href = "#";
    anchor.className = "link";
    anchor.textContent = "click here to close it";
    anchor.addEventListener("click", function (event) {
      event.preventDefault();
      closeWindow();
      try {
        window.location.href = "about:blank";
      } catch (error) {
        void error;
      }
    });

    var shortcut = document.createElement("code");
    shortcut.textContent = "Ctrl+W";

    line.appendChild(document.createTextNode("If the tab did not close automatically, "));
    line.appendChild(anchor);
    line.appendChild(document.createTextNode(" or press "));
    line.appendChild(shortcut);
    line.appendChild(document.createTextNode("."));
    appendLine(line);
  }

  var COMMANDS = {
    help: cmdHelp,
    ls: cmdLs,
    cd: cmdCd,
    pwd: cmdPwd,
    cat: cmdCat,
    clear: cmdClear,
    echo: cmdEcho,
    exit: cmdExit
  };

  var COMMAND_NAMES = Object.keys(COMMANDS);

  function run(raw) {
    var parts = raw.split(/\s+/).filter(Boolean);
    if (parts.length === 0) return;

    var name = parts[0].toLowerCase();
    var args = parts.slice(1);

    if (has(COMMANDS, name)) COMMANDS[name](args);
    else printError("Unknown command: " + name);
  }

  function completionsFor(command) {
    var entries = childrenOf(cwd);

    if (command === "cat") {
      return entries.filter(function (name) {
        var node = getNode(name);
        return !!node && node.type === "file";
      });
    }

    if (command === "cd" || command === "ls") {
      var dirs = entries.filter(function (name) {
        var node = getNode(name);
        return !!node && (node.type === "dir" || node.type === "link");
      });
      if (command === "cd" && cwd !== ROOT) dirs = dirs.concat([".."]);
      return dirs;
    }

    return [];
  }

  function commonPrefix(values) {
    if (values.length === 0) return "";

    var prefix = values[0];
    for (var i = 1; i < values.length; i += 1) {
      var value = values[i];
      var length = 0;
      while (length < prefix.length && length < value.length && prefix.charAt(length) === value.charAt(length)) {
        length += 1;
      }
      prefix = prefix.slice(0, length);
      if (prefix === "") break;
    }
    return prefix;
  }

  function unique(values) {
    return values.filter(function (value, index, all) {
      return all.indexOf(value) === index;
    });
  }

  function setInputValue(value) {
    inputEl.value = value;
    var end = inputEl.value.length;
    try {
      inputEl.setSelectionRange(end, end);
    } catch (error) {
      void error;
    }
  }

  function autocomplete() {
    var value = inputEl.value;
    var leading = value.match(/^\s*/)[0];
    var rest = value.slice(leading.length);
    var parts = rest.length > 0 ? rest.split(/\s+/) : [""];
    var isCommandToken = parts.length === 1;
    var token = parts[parts.length - 1];

    var matches = isCommandToken
      ? COMMAND_NAMES.filter(function (name) {
          return name.indexOf(token.toLowerCase()) === 0;
        })
      : completionsFor(parts[0].toLowerCase()).filter(function (name) {
          return name.indexOf(token) === 0;
        });

    matches = unique(matches);
    if (matches.length === 0) return;

    var completed;
    if (matches.length === 1) {
      completed = matches[0] + " ";
    } else {
      var prefix = commonPrefix(matches);
      if (prefix.length > token.length) {
        completed = prefix;
      } else {
        completed = token;
        echoInput(rest);
        print(matches.map(isCommandToken ? formatCommandName : formatEntry).join("  "));
      }
    }

    parts[parts.length - 1] = completed;
    setInputValue(leading + parts.join(" "));
    scrollToBottom();
  }

  function submit() {
    var raw = inputEl.value.trim();
    inputEl.value = "";
    if (!raw) return;

    echoInput(raw);
    logger.push(raw);
    run(raw);

    history.unshift(raw);
    historyIndex = -1;
  }

  function recallHistory(step) {
    if (history.length === 0) return;

    if (step > 0) historyIndex = Math.min(history.length - 1, historyIndex + 1);
    else historyIndex = Math.max(-1, historyIndex - 1);

    setInputValue(historyIndex === -1 ? "" : history[historyIndex]);
  }

  inputEl.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      submit();
      return;
    }
    if (event.key === "ArrowUp") {
      event.preventDefault();
      recallHistory(1);
      return;
    }
    if (event.key === "ArrowDown") {
      event.preventDefault();
      recallHistory(-1);
      return;
    }
    if (event.key === "Tab") {
      event.preventDefault();
      autocomplete();
    }
  });

  terminalEl.addEventListener("click", function (event) {
    if (event.target.tagName === "A") return;
    inputEl.focus();
  });

  updatePrompt();
  inputEl.focus();
  window.addEventListener("load", function () {
    inputEl.focus();
  });
})();
</script>
</body>
</html>
